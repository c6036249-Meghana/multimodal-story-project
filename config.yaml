
project:
  name: multimodal_story_prediction
  seed: 42

data:
  dataset_name: StoryReasoning
  sequence_length: 3
  image_size: 224
  batch_size: 16

model:
  image_encoder: resnet18
  text_encoder: lstm
  sequence_model: gru
  fusion: concatenation
  attention: false
  hidden_dim: 256

training:
  epochs: 10
  learning_rate: 0.0001
  optimizer: adam
  device: cuda

